id = "haxe"
name = "Haxe"
version = "0.5.0"
schema_version = 1
authors = ["Frixuu <kontakt@lukasz.xyz>", "Jarrio"]
description = "Language server and syntax highlighting support for the Haxe programming language."
repository = "https://github.com/Frixuu/Zed-Haxe"

[grammars.haxe]
repository = "https://github.com/tong/tree-sitter-haxe"
# v0.6.0
rev = "a374f099830aef922e3bbc95464cf596acf9a9cf"

[grammars.hxml]
repository = "https://github.com/Frixuu/tree-sitter-hxml"
rev = "6199e87f50afedab695de1c835430da424ed4ca9"

[language_servers.haxe-language-server]
name = "Haxe Language Server"
# XML comes from Zed's XML extension; the bridge answers completion and hover in UI layouts (HaxeUI).
languages = ["Haxe", "HXML", "XML"]

[language_servers.haxe-language-server.language_ids]
"Haxe" = "haxe"
"HXML" = "hxml"
"XML" = "xml"

